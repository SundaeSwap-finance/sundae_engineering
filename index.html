<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sundae Engineering: systems where agents and people work together</title>
    <meta
      name="description"
      content="Sundae Engineering works inside your team to set up how it runs agents: on machines you manage, with one person answering for each piece of work and a record of what got done. Senior engineers, a few teams at a time."
    />
    <meta name="theme-color" content="#f8f5ef" />
    <link rel="icon" type="image/svg+xml" href="/sundae-mark.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sundae Engineering" />
    <meta
      property="og:description"
      content="We build the systems where agents and people work together. Senior engineers, a few teams at a time."
    />
    <meta property="og:image" content="/sundae-mark.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Sundae Engineering" />
    <meta
      name="twitter:description"
      content="We build the systems where agents and people work together."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>

    <!--
      Static form so Netlify's build-time form detection registers the
      contact form. The live React form (same name + fields) submits to it
      via fetch. If Forms is not enabled, the visible email remains the
      always-available fallback.
    -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="company" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
